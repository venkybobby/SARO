name: SARO CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.15.15" "mypy>=1.0,<2.0"
      - run: ruff check .
      - run: mypy . --ignore-missing-imports

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SARO_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: test_story_index_evidence_gate verifies each cited SHA
          # is an ancestor of HEAD; a shallow clone has no ancestors.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - run: pytest tests/ -m "unit" --tb=short -q
      - run: pytest tests/ -m "integration" --tb=short -q
      - run: pytest tests/ --cov=. --cov-report=xml

  secret-scan:
    # STORY-363: gitleaks gate. Complements (does not replace) the TruffleHog
    # step below — TruffleHog runs --only-verified (live credentials), gitleaks
    # catches credential-SHAPED strings before they ever go live.
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Current-tree scan (BLOCKING)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact
      - name: Full-history scan (report-only until FND-003 history remediation decision — see docs/security/secrets-runbook.md)
        continue-on-error: true
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
      - name: Self-test — seeded canary must fail the default ruleset
        run: |
          if gitleaks detect --no-git --source tests/fixtures/gitleaks_canary --no-banner --redact; then
            echo "::error::gitleaks did NOT flag the seeded canary secret — the gate is not protecting anything"
            exit 1
          fi
          echo "canary correctly detected — gate proven live"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit 'safety<3'
      - run: bandit -r . -ll -x ./tests,./saro-data-framework --format json -o bandit-report.json || true
      - run: bandit -r . --severity-level high -x ./tests,./saro-data-framework && echo "BANDIT_PASS=true"
      - run: safety check -r requirements.txt --full-report || true
      - name: TruffleHog Secret Scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --only-verified --fail

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [test, security]
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SARO_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt playwright pytest-playwright
      - run: playwright install --with-deps chromium
      - run: pytest tests/ -m "e2e" --tb=short -q

  # NOTE: deployment is handled by deploy.yml (Fly.io).
  # The Railway staging job has been removed — SARO deploys to Fly.io only.
