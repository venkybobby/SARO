name: Adapter Conformance (STORY-361)

# "SARO supports Azure/Vertex" must be a tested claim, not a marketing one.
# Any change to adapter code, the normalized contract, or the observation
# rule-packs re-runs the shared scenario suite against EVERY adapter, and
# publishes the per-adapter pass/fail matrix as an artifact.

on:
  pull_request:
    paths:
      - "adapters/**"
      - "rule_packs/observation/**"
      - "tests/conformance/**"
      - "tests/test_story361_conformance.py"
      - "scripts/generate_conformance_report.py"
      - ".github/workflows/conformance.yml"
  push:
    branches: [main]
    paths:
      - "adapters/**"
      - "rule_packs/observation/**"
  workflow_dispatch:

jobs:
  conformance:
    name: Cross-adapter conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyyaml

      # Blocking: a failure here means an adapter no longer conforms.
      - name: Run conformance suite
        run: pytest tests/test_story361_conformance.py -q

      - name: Corpus determinism (attestations depend on byte-identical corpora)
        run: |
          python scripts/azure_corpus_builder.py --check
          python scripts/vertex_corpus_builder.py --check

      - name: Generate conformance report artifact
        run: python scripts/generate_conformance_report.py --check

      # STORY-362: the buyer-facing matrix is generated from adapter behaviour.
      # Stale here means we would be telling a buyer something the code no
      # longer does.
      - name: Capability matrix freshness + claim-language guardrail
        run: python scripts/generate_capability_matrix.py --check

      # STORY-378: labeled-corpus determinism, then the confusion-matrix harness.
      # --check fails the build ONLY against a SIGNED completion bar that is unmet;
      # while STORY-377 is unsigned it is report-only and always exits 0.
      - name: Validation corpus determinism (STORY-378)
        run: python scripts/build_validation_corpus.py --check
      - name: Confusion-matrix harness (report-only until the bar is signed)
        run: python scripts/confusion_matrix_harness.py --check
      - name: Show confusion matrix in the job summary
        if: always()
        run: |
          {
            echo "### Rule-pack confusion matrix (STORY-378)"
            echo '```json'
            cat quality/validation/confusion-latest.json 2>/dev/null || echo "(not generated)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show matrix in the job summary
        if: always()
        run: cat quality/conformance/adapter-conformance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-conformance-report
          path: |
            quality/conformance/adapter-conformance.json
            quality/conformance/adapter-conformance.md
            docs/adapter-capability-matrix.md
            quality/validation/confusion-latest.json
            quality/validation/trend.jsonl
