name: SARO Demo Seed Refresh

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 02:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  refresh-seed:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SARO_DEMO_URL: https://saro-backend.fly.dev
      # Optional: set these repo secrets for a stable, GitHub-masked demo
      # login instead of a fresh (unrecoverable, publicly-redacted) password
      # every scheduled run — see scripts/seed_demo_tenant.py docstring.
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run demo seed refresh
        run: |
          python scripts/seed_demo_tenant.py \
            --database-url "$DATABASE_URL" \
            --saro-url "$SARO_DEMO_URL"
      - name: Verify seed health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SARO_DEMO_URL/health")
          [ "$STATUS" = "200" ] || (echo "Health check failed" && exit 1)
