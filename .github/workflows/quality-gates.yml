name: Quality Gates (Ratchet, Regression, Migrations)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  regression-and-ratchet:
    name: Regression Suite + Quality Ratchet
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SARO_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio pyyaml ruff
      - name: Story-index evidence gate (FM-1/FM-3 — no status claim without a commit)
        run: python scripts/check_story_index.py
      - name: Citation inventory lint (PT-003)
        run: python scripts/check_citations.py
      - name: No-external-model invariant (STORY-336)
        run: python -m grc.guards.external_model
      - name: Claims-consistency guard (STORY-337)
        run: python -m grc.guards.claims_registry
      - name: No placeholder KPI tiles on the Dashboard (STORY-413)
        run: python scripts/check_no_placeholder_kpi_tiles.py
      - name: Manifest integrity (the policy is itself a test)
        run: pytest tests/regression/test_manifest_integrity.py -q
      - name: Loop readiness audit (no loop above its evidence)
        run: python scripts/loop_audit.py --strict
      - name: Full regression suite (never sampled)
        run: pytest tests/regression -q --tb=short
      - name: Coverage run
        run: pytest tests/ -q --cov=. --cov-report=json --tb=no
      - name: Ratchet gate — quality may only improve or hold
        run: python scripts/check_quality_ratchet.py

  migrations-apply:
    name: Migrations Apply Cleanly (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saro
          POSTGRES_PASSWORD: saro
          POSTGRES_DB: saro_migration_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply all SQL migrations in order
        env:
          PGPASSWORD: saro
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            echo "==> applying $f"
            psql -h localhost -U saro -d saro_migration_check -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All SQL migrations applied cleanly to a fresh database."
      - name: Note non-SQL migrations
        run: ls migrations/*.py 2>/dev/null && echo "::warning::Python migrations exist — not covered by this gate; verify via docs/MIGRATION_RUNBOOK.md" || true

  lifecycle-guard:
    name: Lifecycle Guard (impl-notes on multi-file PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce lifecycle on multi-file PRs
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -v '^implementation-notes\.md$' | wc -l)
          NOTES=$(git diff --name-only "$BASE" "$HEAD" | grep -c '^implementation-notes\.md$' || true)
          echo "Changed: $CHANGED | notes touched: $NOTES"
          [ "$CHANGED" -lt 3 ] && exit 0
          if grep -qi '^Stage:[[:space:]]*trivial' implementation-notes.md 2>/dev/null; then exit 0; fi
          if [ "$NOTES" -eq 0 ]; then
            echo "::error::PR changes $CHANGED files but implementation-notes.md was not updated."
            exit 1
          fi
          if ! grep -q '^## Deviations' implementation-notes.md; then
            echo "::error::implementation-notes.md is missing a '## Deviations' section."
            exit 1
          fi
          if grep -q '^\- \[ \] verify' implementation-notes.md; then
            echo "::error::verify stage unchecked — produce change-debrief.html or mark verify skipped with a reason."
            exit 1
          fi
