name: Release (tagged)

# STORY-375: the tagged-release pipeline. Pushing a v<x.y.z> tag runs the gates
# that must hold for a release — the conformance suite (STORY-361) and the full
# test suite — BEFORE deploying, then the post-deploy canary (STORY-368,
# workflow_run on the Deploy workflow) confirms the release end to end.
#
# The changelog gate is enforced on the release PR (changelog-gate below on
# pull_request), not here — by tag time the entry must already exist.

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  # Runs on every release-labelled PR: no release ships without a curated
  # changelog entry.
  changelog-gate:
    name: Changelog entry required (release PRs)
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       startsWith(github.event.pull_request.title, 'release:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a curated CHANGELOG entry
        run: |
          python scripts/check_changelog_entry.py \
            --base "origin/${{ github.base_ref }}" --head HEAD

  # Runs on a v* tag: the release gates, then deploy is handled by deploy.yml on
  # the tagged commit and the canary confirms it (workflow_run).
  release-gates:
    name: Release gates (conformance + tests)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SARO_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match _version.py
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import importlib.util,pathlib; \
            spec=importlib.util.spec_from_file_location('v', pathlib.Path('_version.py')); \
            m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(m.__version__)")
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match _version.py ($VER) — bump the version source and CHANGELOG first"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio pyyaml

      - name: Conformance suite (STORY-361)
        run: pytest tests/test_story361_conformance.py -q

      - name: Full test suite
        run: pytest tests/ -q

      - name: Changelog has a released section for this tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          grep -q "## \[$TAG\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no released section for [$TAG] — move Unreleased entries under a versioned heading before tagging"
            exit 1
          }

      # Deploy + post-deploy canary are handled by deploy.yml (push) and
      # canary.yml (workflow_run on Deploy). Not duplicated here.
